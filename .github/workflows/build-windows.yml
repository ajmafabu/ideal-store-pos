name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Building version: $version"

      - name: Build Windows
        run: flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Create zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "ideal-store-pos-${version}-windows.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Ideal Store POS ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Ideal Store POS v${{ steps.version.outputs.VERSION }}
            
            ### Installation
            1. Download `ideal-store-pos-${{ steps.version.outputs.VERSION }}-windows.zip`
            2. Extract the zip folder
            3. Run `ideal_store_pos.exe`
            
            The app will auto-update when new versions are released.
          files: ideal-store-pos-${{ steps.version.outputs.VERSION }}-windows.zip
          draft: false
          prerelease: false
